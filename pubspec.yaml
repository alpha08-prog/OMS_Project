name: anki_clone
description: A comprehensive Anki-like flashcard application

publish_to: "none"

version: 1.0.2+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.1.0
  intl: ^0.19.0

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # Image Picker
  image_picker: ^1.0.4
  google_fonts: ^6.2.1

  # UI Icons
  cupertino_icons: ^1.0.2
  http_parser: ^4.0.2
  mime: ^1.0.4
  url_launcher: ^6.2.5

  # File Download & Open
  path_provider: ^2.1.1
  open_filex: ^4.3.4
  fl_chart: ^1.2.0

  # File Picker (PDF / images)
  file_picker: ^8.1.2

  # HTML rendering (in-app preview of letters)
  flutter_html: ^3.0.0-beta.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/icon.png
    - assets/icon/icon_foreground.png

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#E3ECF5"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
