name: CD – Build, Push & Deploy

# ─────────────────────────────────────────────────────────────
# Triggers ONLY when the CI workflow completes successfully on
# the main branch. This guarantees tests pass before deploying.
# ─────────────────────────────────────────────────────────────
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write   # Required to push backend image to GHCR

# Cancel any in-progress CD run if a newer one is triggered
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY:      ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/oms-backend

jobs:

  # ───────────────────────────────────────────────────────────
  # Guard: skip the whole pipeline if CI failed
  # ───────────────────────────────────────────────────────────
  guard:
    name: CI Status Gate
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: CI passed – proceeding to deploy
        run: echo "CI finished successfully. Starting CD pipeline."

  # ───────────────────────────────────────────────────────────
  # Job 1: Build & push the Backend Docker image to GHCR
  # (Backend runs on Catalyst AppSail – container-based)
  # ───────────────────────────────────────────────────────────
  build-push-backend:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    needs: guard
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx (multi-platform cache support)
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            # Tag with short SHA for traceability (e.g. sha-a1b2c3d).
            # priority=300 makes this the value of meta.outputs.version,
            # so deploy-backend can pin the AppSail deploy to this exact SHA
            # (avoids the ":latest" no-pull problem on container platforms).
            type=sha,prefix=sha-,format=short,priority=300
            # Also update the `latest` tag on main (humans / fallback only).
            type=raw,value=latest,enable=true

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          dockerfile: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,scope=backend,mode=max

  # ───────────────────────────────────────────────────────────
  # Job 2: Build frontend static files (dist/)
  # (Frontend runs on Catalyst Slate – static hosting, no Docker)
  # ───────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend (Static)
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Vite app
        working-directory: frontend
        run: npm run build
        # Output: frontend/dist/

      - name: Upload dist/ as artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  # ───────────────────────────────────────────────────────────
  # Job 3: Deploy Backend to Zoho Catalyst AppSail
  # ───────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Catalyst AppSail
    runs-on: ubuntu-latest
    needs: [build-push-backend, build-frontend]
    environment:
      name: production
      url: https://omsvackend-${{ vars.CATALYST_PROJECT_DOMAIN }}.development.catalystappsail.in

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js (for Catalyst CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Zoho Catalyst CLI
        run: npm install -g zcatalyst-cli

      - name: Debug — what does this Catalyst CLI know?
        # One-time introspection so we stop guessing at flag names. Captures
        # CLI version, subcommands, deploy/login flags, expected config-file
        # locations, and which env vars it reads. Always exits 0 — never
        # blocks the workflow on its own.
        continue-on-error: true
        run: |
          set +e
          echo "=== catalyst --version ==="
          catalyst --version
          echo "=== catalyst --help ==="
          catalyst --help
          echo "=== catalyst deploy --help ==="
          catalyst deploy --help
          echo "=== catalyst login --help ==="
          catalyst login --help
          echo "=== catalyst projects --help ==="
          catalyst projects --help
          echo "=== Files at HOME ==="
          ls -la "$HOME" 2>&1 | head -40
          echo "--- catalyst-shaped files in HOME ---"
          ls -la "$HOME/.catalyst"* "$HOME/.zoho"* 2>&1
          echo "--- catalyst-shaped files in cwd ---"
          ls -la ./.catalystrc ./catalyst.json 2>&1
          echo "=== ENV vars referencing catalyst/zoho ==="
          env | grep -iE 'catalyst|zoho|zcatalyst' | sed 's/=.*$/=<redacted>/'

      - name: Get Catalyst Access Token (OAuth refresh)
        id: zoho_token
        run: |
          RESPONSE=$(curl -s -X POST "https://accounts.zoho.in/oauth/v2/token" \
            -d "client_id=${{ secrets.ZOHO_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.ZOHO_CLIENT_SECRET }}" \
            -d "refresh_token=${{ secrets.ZOHO_REFRESH_TOKEN }}" \
            -d "grant_type=refresh_token")
          ACCESS_TOKEN=$(echo "$RESPONSE" | grep -o '"access_token":"[^"]*' | cut -d'"' -f4)
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to get access token. Response: $RESPONSE"
            exit 1
          fi
          echo "::add-mask::$ACCESS_TOKEN"
          echo "access_token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT

      - name: Write Catalyst CLI project config (.catalystrc)
        env:
          CATALYST_PROJECT_ID: ${{ secrets.CATALYST_PROJECT_ID }}
        # The Catalyst CLI reads project/env metadata from .catalystrc in
        # the working dir (or a parent). In CI there is no such file, so
        # `--project` alone is not enough — the CLI errors "Org and Project
        # Id cannot be empty". We synthesize a minimal .catalystrc that
        # mirrors the developer's local one (project Project01, env
        # Development). Domain ID 50040756292 and env ID 60069018829 are
        # project identifiers (visible in the live AppSail URL), not
        # credentials.
        run: |
          set -euo pipefail
          : "${CATALYST_PROJECT_ID:?CATALYST_PROJECT_ID secret not set}"
          cat > .catalystrc <<EOF
          {
            "defaults": { "project": 1, "env": 1 },
            "actives": { "project": 1, "env": 1 },
            "projects": [{
              "idx": 1,
              "id": "${CATALYST_PROJECT_ID}",
              "name": "Project01",
              "domain": { "id": "50040756292", "name": "project01-60069018829.development" },
              "timezone": "Asia/Kolkata",
              "env": [
                { "idx": 1, "id": "60069018829", "name": "Development", "type": 3 }
              ]
            }]
          }
          EOF
          # Some CLI versions look in $HOME instead of cwd — write to both.
          cp .catalystrc "$HOME/.catalystrc"

      - name: Deploy backend AppSail service
        env:
          CATALYST_TOKEN: ${{ steps.zoho_token.outputs.access_token }}
          CATALYST_PROJECT_ID: ${{ secrets.CATALYST_PROJECT_ID }}
          # Org ID = 60069018829 (visible in Catalyst console → Hello, OMS →
          # Org ID). Not a credential — it's a public account identifier
          # like a username — so it stays inline rather than as a secret.
          CATALYST_ORG_ID: "60069018829"
          # Also export under the alternate names the CLI / SDK is known to
          # read, so whichever convention this CLI version uses, it picks up.
          ZCATALYST_ORG_ID: "60069018829"
          ZCATALYST_PROJECT_ID: ${{ secrets.CATALYST_PROJECT_ID }}
        # AppSail is source-based: catalyst.json declares "source": "backend",
        # so the CLI uploads the backend/ folder and Catalyst rebuilds the
        # container. The GHCR image from build-push-backend is unused for
        # this deploy path; it stays as a backup artifact.
        #
        # The CLI prints "✖ Error" but exits 0 on auth/config failures,
        # which is why every previous CD run looked green while never
        # touching omsvackend. We grep stdout/stderr and fail loudly.
        run: |
          set -uo pipefail
          : "${CATALYST_TOKEN:?Failed to obtain Catalyst access token}"
          : "${CATALYST_PROJECT_ID:?CATALYST_PROJECT_ID secret not set}"
          : "${CATALYST_ORG_ID:?CATALYST_ORG_ID not set}"

          OUTPUT=$(catalyst deploy --only appsail \
            --token "$CATALYST_TOKEN" \
            --project "$CATALYST_PROJECT_ID" \
            --org "$CATALYST_ORG_ID" 2>&1)
          RC=$?
          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -qE "✖|Error:|cannot be empty|haven't logged in|invalid"; then
            echo "::error::Catalyst CLI reported errors above; deploy did NOT succeed (exit was $RC)"
            exit 1
          fi
          if [ "$RC" -ne 0 ]; then
            echo "::error::catalyst deploy exited $RC"
            exit "$RC"
          fi

      - name: Verify backend is healthy after deploy
        # Polls /api/health until the container responds 200 with success:true,
        # or fails the workflow after ~5 minutes. Without this, a silent
        # deploy failure leaves the old container serving traffic and the
        # green checkmark hides it.
        run: |
          set -euo pipefail
          URL="https://omsvackend-${{ vars.CATALYST_PROJECT_DOMAIN }}.development.catalystappsail.in/api/health"
          echo "Polling $URL ..."
          for i in $(seq 1 30); do
            if BODY=$(curl -fsS --max-time 30 "$URL" 2>&1); then
              echo "$BODY"
              if echo "$BODY" | grep -q '"success":true'; then
                echo "Backend healthy after deploy (attempt $i)."
                exit 0
              fi
            fi
            echo "Attempt $i/30: not ready yet, sleeping 10s..."
            sleep 10
          done
          echo "::error::Backend never reported healthy within 5 minutes — check AppSail console for build/start errors"
          exit 1

  # ───────────────────────────────────────────────────────────
  # Job 4: Deploy Frontend to Zoho Catalyst Slate (static hosting)
  # Uploads the built dist/ folder – no Docker involved.
  # ───────────────────────────────────────────────────────────
  deploy-frontend-slate:
    name: Deploy Frontend → Catalyst Slate
    runs-on: ubuntu-latest
    needs: [build-push-backend, build-frontend]
    environment:
      name: production
      url: https://${{ vars.CATALYST_PROJECT_DOMAIN }}.catalystserverless.in

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Zoho Catalyst CLI
        run: npm install -g zcatalyst-cli

      - name: Get Catalyst Access Token (OAuth refresh)
        id: zoho_token
        run: |
          RESPONSE=$(curl -s -X POST "https://accounts.zoho.in/oauth/v2/token" \
            -d "client_id=${{ secrets.ZOHO_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.ZOHO_CLIENT_SECRET }}" \
            -d "refresh_token=${{ secrets.ZOHO_REFRESH_TOKEN }}" \
            -d "grant_type=refresh_token")
          ACCESS_TOKEN=$(echo "$RESPONSE" | grep -o '"access_token":"[^"]*' | cut -d'"' -f4)
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to get access token. Response: $RESPONSE"
            exit 1
          fi
          echo "::add-mask::$ACCESS_TOKEN"
          echo "access_token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT

      - name: Authenticate Catalyst CLI
        run: catalyst login --token "${{ steps.zoho_token.outputs.access_token }}"

      - name: Deploy static files to Catalyst Web Client
        env:
          CATALYST_PROJECT_ID: ${{ secrets.CATALYST_PROJECT_ID }}
        run: |
          cat <<EOF > catalyst.json
          {
            "client": {
              "source": "frontend/dist"
            }
          }
          EOF
          catalyst deploy \
            --project "$CATALYST_PROJECT_ID" \
            --only client

      - name: Confirm frontend deployment
        run: echo "Frontend deployed to Catalyst Slate (static hosting)."

  # ───────────────────────────────────────────────────────────
  # Job 5: Post-deployment summary
  # ───────────────────────────────────────────────────────────
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend-slate]
    if: always()
    steps:
      - name: Print deployment result
        run: |
          echo "========================================="
          echo "  OMS Deployment Summary"
          echo "========================================="
          echo "  Backend  → Catalyst AppSail (Docker/GHCR)"
          echo "  Frontend → Catalyst Slate   (static dist/)"
          echo "  Commit SHA : ${{ github.event.workflow_run.head_sha }}"
          echo "  Backend  : ${{ needs.deploy-backend.result }}"
          echo "  Frontend : ${{ needs.deploy-frontend-slate.result }}"
          echo "========================================="
